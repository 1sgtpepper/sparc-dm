[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sparc_dm"
version = "0.1.0"
description = "Dark matter halo rotation-curve modeling, numerical quadrature, optimization, and galactic orbit dynamics on the SPARC catalog."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "matplotlib",
]

[project.scripts]
sparc-dm = "sparc_dm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v"
